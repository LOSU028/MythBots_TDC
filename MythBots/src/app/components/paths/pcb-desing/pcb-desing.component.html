<article class="pcbDesign">
    <!-- Banner -->
    <header class="banner">
        <div class="bannerContenido">
            <h1 class="bannerTitulo">PCB Design</h1>
            <p class="bannerDescripcion">Agregar una descripción del servicio de diseño de PCB.</p>
        </div>
        <figure class="bannerImagen"></figure>
    </header>


    <!-- Contenedor Selección Básico/Personalizado -->
    <div class="formSeleccion">
        <label class="formLabel">Selecciona un tipo:</label>
        <select class="formInput tipoSeleccion" name="tipo" required>
            <option value="basico">Básico</option>
            <option value="personalizado">Personalizado</option>
        </select>
    </div>

    <!-- Formulario de Cotización -->
    <section class="cotizar">
        <h2 class="cotizarTitulo">Cotizar precio</h2>
        <p class="cotizarParrafo">Por favor introduce los siguientes datos:</p>

        <form class="formulario">

            <!-- Campo Nombre y Apellido en la misma fila -->
            <section class="formNombreApellido">
                <div class="formCampo">
                    <label for="nombre" class="formLabel">Nombre(s)
                        <span class="requerido">*</span>
                    </label>
                    <input type="text" id="nombre" class="formInput" name="nombre" placeholder="Escribe tu nombre"
                        required>
                </div>

                <div class="formCampo">
                    <label for="apellido" class="formLabel">Apellido(s)
                        <span class="requerido">*</span>
                    </label>
                    <input type="text" id="apellido" class="formInput" name="apellido" placeholder="Escribe tu apellido" required>
                </div>
            </section>

            <!-- Campo Email y Telefono en la misma fila -->
            <section class="formEmailPhone">
                <div class="formCampo">
                    <label for="email" class="formLabel">Email
                        <span class="requerido">*</span>
                    </label>
                    <input type="email" id="email" class="formInput" name="email" placeholder="Escribe tu correo electronico" required>
                </div>

                <div class="formCampo">
                    <label for="phone" class="formLabel">Telefono
                        <span class="requerido">*</span>
                    </label>
                    <input type="number" id="phone" class="formInput" name="phone" placeholder="Escribe tu numero telefonico" required>
                </div>
            </section>

            <!-- Campo para Subir Archivo -->
            <div class="formCampo">
                <label for="archivo" class="formLabel">Subir archivo</label>
                <div class="inputArchivo">
                    <input type="file" id="archivo" class="formInput archivo" name="archivo">
                    <span class="iconEliminar" onclick="eliminarArchivo()">🗑️</span> <!-- Emoji para eliminar -->
                </div>
            </div>

            <!-- Campo Descripción -->
            <div class="formCampo">
                <label for="descripcion" class="formLabel">Descripción</label>
                <textarea id="descripcion" class="formInput" name="descripcion" rows="4"
                    placeholder="Cuentanos un poco mas sobre tu proyecto" required></textarea>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="formBoton">Enviar</button>
        </form>
    </section>
</article>
