<article class="customize-funko-page">
    <!-- Sección del Visor 3D -->
    <div class="funko-preview">
        <div class="model-viewer-placeholder">
            <p>Vista previa 3D</p>
        </div>
    </div>

    <!-- Sección de Opciones y Contenido -->
    <div class="funko-options">
        <!-- Lista de Categorías dentro de un Trapecio -->
        <div class="options-header">
            <div class="shape">
                <ul class="options-list">
                    <li>Color</li>
                    <li>Cuerpo</li>
                    <li>Cabello</li>
                    <li>Camisa</li>
                    <li>Pantalones</li>
                    <li>Ojos</li>
                    <li>Accesorios</li>
                </ul>
            </div>
        </div>

        <!-- Cards de Opciones -->
        <div class="options-cards-container">
            <div class="option-card">
                <img src="assets/imgs/option1.png" alt="Opción 1" />
                <p>Opción 1</p>
            </div>
            <div class="option-card">
                <img src="assets/imgs/option2.png" alt="Opción 2" />
                <p>Opción 2</p>
            </div>
            <div class="option-card">
                <img src="assets/imgs/option3.png" alt="Opción 3" />
                <p>Opción 3</p>
            </div>
        </div>

        <!-- Botones de Navegación -->
        <div class="action-buttons">
            <button class="btn-back" disabled>Regresar</button>
            <button class="btn-continue" disabled>Continuar</button>
        </div>
    </div>
</article>
